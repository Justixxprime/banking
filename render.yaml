# Render Blueprint: deploys the app as a Node web service backed by your Neon database.
services:
  - type: web
    name: mountain-hills-cu
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL        # paste your full Neon connection string in the Render dashboard
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SEED_DEMO_DATA
        value: "false"
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
